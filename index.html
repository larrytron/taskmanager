<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7inIU8L3RleHQ+PC9zdmc+">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#E7F1FB; --surface:#FFFFFF; --surface-2:#DBEAF8;
    --ink:#22303F; --ink-muted:#5E7385; --line:#CBDFF0;
    --accent:#5B6FD6; --accent-deep:#3E4FB0; --accent-soft:#E7E9FA;
    --warn:#C98A2E; --warn-soft:#FBF0DC;
    --critical:#C25B4A; --critical-soft:#FBE4DF;
    --good:#4C9B74; --good-soft:#E3F4EA;
    --gone:#9B6B95; --gone-soft:#F3E7F1;
    --shadow:0 1px 2px rgba(43,49,66,.06), 0 8px 24px rgba(43,49,66,.07);
    --radius:10px;
    --font-display:"Manrope","Segoe UI",sans-serif;
    --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1B29; --surface:#16273A; --surface-2:#1B3049;
      --ink:#E6EEF6; --ink-muted:#8FA3B6; --line:#264363;
      --accent:#8B98E8; --accent-deep:#5B6FD6; --accent-soft:#262C48;
      --warn:#E3AD5C; --warn-soft:#3B2E1C;
      --critical:#E58B7B; --critical-soft:#3B241F;
      --good:#7FCBA0; --good-soft:#1E3327;
      --gone:#C79BC1; --gone-soft:#332639;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1B29; --surface:#16273A; --surface-2:#1B3049;
    --ink:#E6EEF6; --ink-muted:#8FA3B6; --line:#264363;
    --accent:#8B98E8; --accent-deep:#5B6FD6; --accent-soft:#262C48;
    --warn:#E3AD5C; --warn-soft:#3B2E1C;
    --critical:#E58B7B; --critical-soft:#3B241F;
    --good:#7FCBA0; --good-soft:#1E3327;
    --gone:#C79BC1; --gone-soft:#332639;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  #app{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}

  .topbar{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:2px solid var(--ink);
  }
  .topbar-title{display:flex; flex-direction:column; gap:2px;}
  .topbar-title h1{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(30px,5vw,42px); margin:0; color:var(--ink);
    text-wrap:balance;
  }
  .topbar-title p{margin:0; color:var(--ink-muted); font-size:13px; font-family:var(--font-mono);}
  .topbar-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .topbar-controls{display:flex; align-items:center; gap:8px;}
  .undo-btn{
    display:flex; align-items:center; gap:6px; font-size:12.5px; padding:8px 14px;
    background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-deep);
  }
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px;}
  .tab-btn{
    font-family:var(--font-body); font-weight:600; font-size:13px; letter-spacing:.02em;
    border:none; background:transparent; color:var(--ink-muted); padding:7px 16px;
    border-radius:999px; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent-deep); color:#fff;}
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .save-status{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:6px;}
  .save-status .dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none;}
  .save-status.offline .dot{background:var(--ink-muted);}

  .summary-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px;}
  .view-mode-toggle{margin-left:auto;}
  .summary-chip{
    display:flex; align-items:baseline; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; box-shadow:var(--shadow);
  }
  .summary-chip b{font-family:var(--font-mono); font-size:16px;}
  .summary-chip span{font-size:12px; color:var(--ink-muted);}
  .summary-chip.warn b{color:var(--warn);}
  .summary-chip.critical b{color:var(--critical);}

  .groups-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px;
    align-items:start;
  }
  .groups-list{display:flex; flex-direction:column; gap:14px;}
  .list-section{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .plate{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    border-top:4px solid var(--accent);
    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  }
  .plate-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:var(--surface-2); border-bottom:1px solid var(--line);
  }
  .plate-num{
    font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:500;
    border:1px solid var(--accent); border-radius:4px; padding:2px 6px; flex:none;
  }
  .plate-name-wrap{flex:1; min-width:0;}
  .plate-name{
    font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:0;
    color:var(--ink); display:block;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rename-input{
    font-family:var(--font-display); font-weight:600; font-size:20px;
    width:100%; border:1px solid var(--accent); border-radius:4px; background:var(--surface);
    color:var(--ink); padding:2px 6px;
  }
  .count-badge{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);
    background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 8px; flex:none;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--ink-muted); cursor:pointer;
    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:hover{background:var(--bg); color:var(--ink);}
  .icon-btn.danger-hover:hover{background:var(--critical-soft); color:var(--critical);}

  .task-list{
    display:flex; flex-direction:column; padding:6px 8px;
    max-height:360px; overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .task-list.list-mode{max-height:none; overflow-y:visible;}
  .empty-note{color:var(--ink-muted); font-size:13px; padding:12px 10px; margin:0;}
  .task-row{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px;
  }
  .task-row:hover{background:var(--bg);}
  .task-row.dragging{opacity:.35;}
  .task-row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent);}
  .task-row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent);}
  .drag-handle{
    display:flex; align-items:center; justify-content:center; flex:none;
    width:16px; color:var(--ink-muted); opacity:.45; cursor:grab;
  }
  .task-row:hover .drag-handle{opacity:.9;}
  .drag-handle:active{cursor:grabbing;}
  .complete-btn{
    width:18px; height:18px; border-radius:50%; border:1.4px solid var(--ink-muted);
    background:transparent; color:transparent; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .complete-btn:hover{border-color:var(--good); color:var(--good); background:var(--good-soft);}
  .task-title{
    flex:1; min-width:0; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--ink); font-family:var(--font-body); font-size:14.5px; font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 0;
  }
  .task-title:hover{color:var(--accent); text-decoration:underline;}
  .task-right{display:flex; align-items:center; gap:6px; flex:none;}
  .deadline-pill{
    font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:999px;
    white-space:nowrap; color:var(--ink-muted); background:var(--surface-2);
  }
  .deadline-pill.warn{color:var(--warn); background:var(--warn-soft);}
  .deadline-pill.critical{color:var(--critical); background:var(--critical-soft);}

  details.add-task{border-top:1px solid var(--line); padding:4px 10px 10px;}
  details.add-task summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;
    color:var(--accent); font-weight:600; font-size:13px; padding:8px 6px; border-radius:6px;
  }
  details.add-task summary::-webkit-details-marker{display:none;}
  details.add-task summary:hover{background:var(--accent-soft);}
  .add-task-form{display:flex; flex-direction:column; gap:8px; padding:8px 6px 2px;}
  .add-task-form input[type="text"], .add-task-form textarea{
    font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink); resize:vertical;
  }
  .deadline-field{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-muted);}
  .deadline-field input[type="date"]{
    font-family:var(--font-mono); font-size:12.5px; padding:5px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink);
  }
  .form-actions{display:flex; gap:8px; justify-content:flex-end;}

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px; border-radius:7px;
    padding:8px 16px; cursor:pointer; border:1px solid transparent;
  }
  .btn.primary{background:var(--accent-deep); color:#fff;}
  .btn.primary:hover{background:var(--accent);}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.danger{color:var(--critical); border-color:var(--critical-soft);}
  .btn.danger:hover{background:var(--critical-soft);}
  .btn.small{padding:6px 12px; font-size:12.5px;}

  .plate.plate-add{align-items:center; justify-content:center; padding:22px; border-style:dashed; background:transparent; box-shadow:none;}
  .add-group-btn{display:flex; align-items:center; gap:6px;}
  .plate-add input[type="text"]{
    width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); margin-bottom:8px;
  }

  .history-toolbar{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .history-toolbar select{
    font-family:var(--font-body); font-size:13px; padding:7px 10px; border:1px solid var(--line);
    border-radius:7px; background:var(--surface); color:var(--ink);
  }
  #history-list{display:flex; flex-direction:column; gap:8px;}
  .history-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:10px 14px; cursor:pointer;
  }
  .history-row:hover{border-color:var(--accent);}
  .status-chip{
    font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:999px; flex:none;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .status-chip.good{color:var(--good); background:var(--good-soft);}
  .status-chip.gone{color:var(--gone); background:var(--gone-soft);}
  .history-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .history-title{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-group{font-size:12px; color:var(--ink-muted); font-family:var(--font-mono);}
  .history-dates{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); flex:none;}

  .overlay{
    position:fixed; inset:0; background:rgba(15,22,32,.45); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .detail-card{
    background:var(--surface); border-radius:12px; box-shadow:var(--shadow); max-width:480px; width:100%;
    max-height:86vh; overflow-y:auto; padding:20px 22px 22px;
  }
  .detail-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .detail-group{font-family:var(--font-mono); font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
  .detail-title{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 10px; text-wrap:balance;}
  .detail-desc{font-size:14px; line-height:1.6; color:var(--ink); margin:0 0 14px; white-space:pre-wrap;}
  .detail-desc.muted{color:var(--ink-muted); font-style:italic;}
  .detail-meta{display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:18px;}
  .meta-item{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);}
  .meta-item.warn{color:var(--warn);}
  .meta-item.critical{color:var(--critical);}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .edit-title{font-family:var(--font-body); font-size:18px; font-weight:600; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px;}
  .edit-desc{width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px; resize:vertical;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:60;
    max-width:90vw; text-align:center;
  }

  @media (max-width:640px){
    .topbar{flex-direction:column; align-items:flex-start;}
    .topbar-right{align-items:flex-start;}
  }
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Task Manager</h1>
        <p>El teu full de ruta — PRISMA · ATLAS · ATLAS X · EA CTTI</p>
      </div>
      <div class="topbar-right">
        <span id="save-status" class="save-status offline"><span class="dot"></span><span class="save-status-text">Vista prèvia</span></span>
        <div class="topbar-controls">
          <div class="tabs">
            <button type="button" id="tab-pending" class="tab-btn active">Pendents</button>
            <button type="button" id="tab-history" class="tab-btn">Historial</button>
          </div>
          <button type="button" id="undo-btn" class="btn undo-btn" hidden>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8H12.5A3.5 3.5 0 0116 11.5V11.5A3.5 3.5 0 0112.5 15H8"/><path d="M8 5L5 8L8 11"/></svg>
            Desfés
          </button>
        </div>
      </div>
    </header>

    <div id="view-pending" class="view">
      <div class="summary-bar">
        <span class="summary-chip"><b id="summary-pending">0</b><span>pendents</span></span>
        <span class="summary-chip warn"><b id="summary-warn">0</b><span>a punt de vèncer</span></span>
        <span class="summary-chip critical"><b id="summary-crit">0</b><span>endarrerides</span></span>
        <div class="tabs view-mode-toggle">
          <button type="button" id="view-cards" class="tab-btn active">Targetes</button>
          <button type="button" id="view-list" class="tab-btn">Llista</button>
        </div>
      </div>
      <div id="groups" class="groups-grid"></div>
    </div>

    <div id="view-history" class="view" hidden>
      <div class="history-toolbar">
        <select id="history-status-filter">
          <option value="all">Totes</option>
          <option value="completed">Completades</option>
          <option value="deleted">Eliminades</option>
        </select>
        <select id="history-group-filter">
          <option value="all">Tots els programes</option>
        </select>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="detail-overlay" class="overlay" hidden>
    <div id="detail-card" class="detail-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="application/json" id="state-data">{"groups":[{"id":"g-prisma","name":"Programa PRISMA","tasks":[]},{"id":"g-atlas","name":"Programa ATLAS","tasks":[]},{"id":"g-atlasx","name":"Producte ATLAS X","tasks":[]},{"id":"g-ea","name":"EA al CTTI","tasks":[]},{"id":"g-me","name":"Me","tasks":[]}],"history":[],"settings":{"viewMode":"cards"},"lastResolvedId":null}</script>
  <script>

63;\n    --accent:#8B98E8; --accent-deep:#5B6FD6; --accent-soft:#262C48;\n    --warn:#E3AD5C; --warn-soft:#3B2E1C;\n    --critical:#E58B7B; --critical-soft:#3B241F;\n    --good:#7FCBA0; --good-soft:#1E3327;\n    --gone:#C79BC1; --gone-soft:#332639;\n    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);\n  }\n  *{box-sizing:border-box;}\n  [hidden]{display:none !important;}\n  html{color-scheme:light dark;}\n  body{\n    margin:0; background:var(--bg); color:var(--ink);\n    font-family:var(--font-body); font-size:15px; line-height:1.5;\n  }\n  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }\n\n  #app{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}\n\n  .topbar{\n    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;\n    gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:2px solid var(--ink);\n  }\n  .topbar-title{display:flex; flex-direction:column; gap:2px;}\n  .topbar-title h1{\n    font-family:var(--font-display); font-weight:600;\n    font-size:clamp(30px,5vw,42px); margin:0; color:var(--ink);\n    text-wrap:balance;\n  }\n  .topbar-title p{margin:0; color:var(--ink-muted); font-size:13px; font-family:var(--font-mono);}\n  .topbar-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px;}\n  .topbar-controls{display:flex; align-items:center; gap:8px;}\n  .undo-btn{\n    display:flex; align-items:center; gap:6px; font-size:12.5px; padding:8px 14px;\n    background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-deep);\n  }\n  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px;}\n  .tab-btn{\n    font-family:var(--font-body); font-weight:600; font-size:13px; letter-spacing:.02em;\n    border:none; background:transparent; color:var(--ink-muted); padding:7px 16px;\n    border-radius:999px; cursor:pointer;\n  }\n  .tab-btn.active{background:var(--accent-deep); color:#fff;}\n  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{\n    outline:2px solid var(--accent); outline-offset:2px;\n  }\n  .save-status{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:6px;}\n  .save-status .dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none;}\n  .save-status.offline .dot{background:var(--ink-muted);}\n\n  .summary-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px;}\n  .view-mode-toggle{margin-left:auto;}\n  .summary-chip{\n    display:flex; align-items:baseline; gap:6px; background:var(--surface); border:1px solid var(--line);\n    border-radius:999px; padding:6px 14px; box-shadow:var(--shadow);\n  }\n  .summary-chip b{font-family:var(--font-mono); font-size:16px;}\n  .summary-chip span{font-size:12px; color:var(--ink-muted);}\n  .summary-chip.warn b{color:var(--warn);}\n  .summary-chip.critical b{color:var(--critical);}\n\n  .groups-grid{\n    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px;\n    align-items:start;\n  }\n  .groups-list{display:flex; flex-direction:column; gap:14px;}\n  .list-section{\n    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);\n    box-shadow:var(--shadow); overflow:hidden;\n  }\n  .plate{\n    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);\n    border-top:4px solid var(--accent);\n    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;\n  }\n  .plate-head{\n    display:flex; align-items:center; gap:10px; padding:14px 16px;\n    background:var(--surface-2); border-bottom:1px solid var(--line);\n  }\n  .plate-num{\n    font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:500;\n    border:1px solid var(--accent); border-radius:4px; padding:2px 6px; flex:none;\n  }\n  .plate-name-wrap{flex:1; min-width:0;}\n  .plate-name{\n    font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:0;\n    color:var(--ink); display:block;\n    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\n  }\n  .rename-input{\n    font-family:var(--font-display); font-weight:600; font-size:20px;\n    width:100%; border:1px solid var(--accent); border-radius:4px; background:var(--surface);\n    color:var(--ink); padding:2px 6px;\n  }\n  .count-badge{\n    font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);\n    background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 8px; flex:none;\n  }\n  .icon-btn{\n    border:none; background:transparent; color:var(--ink-muted); cursor:pointer;\n    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex:none;\n  }\n  .icon-btn:hover{background:var(--bg); color:var(--ink);}\n  .icon-btn.danger-hover:hover{background:var(--critical-soft); color:var(--critical);}\n\n  .task-list{\n    display:flex; flex-direction:column; padding:6px 8px;\n    max-height:360px; overflow-y:auto;\n    scrollbar-width:thin; scrollbar-color:var(--line) transparent;\n  }\n  .task-list.list-mode{max-height:none; overflow-y:visible;}\n  .empty-note{color:var(--ink-muted); font-size:13px; padding:12px 10px; margin:0;}\n  .task-row{\n    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px;\n  }\n  .task-row:hover{background:var(--bg);}\n  .task-row.dragging{opacity:.35;}\n  .task-row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent);}\n  .task-row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent);}\n  .drag-handle{\n    display:flex; align-items:center; justify-content:center; flex:none;\n    width:16px; color:var(--ink-muted); opacity:.45; cursor:grab;\n  }\n  .task-row:hover .drag-handle{opacity:.9;}\n  .drag-handle:active{cursor:grabbing;}\n  .complete-btn{\n    width:18px; height:18px; border-radius:50%; border:1.4px solid var(--ink-muted);\n    background:transparent; color:transparent; cursor:pointer; flex:none;\n    display:flex; align-items:center; justify-content:center;\n  }\n  .complete-btn:hover{border-color:var(--good); color:var(--good); background:var(--good-soft);}\n  .task-title{\n    flex:1; min-width:0; text-align:left; background:none; border:none; cursor:pointer;\n    color:var(--ink); font-family:var(--font-body); font-size:14.5px; font-weight:500;\n    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 0;\n  }\n  .task-title:hover{color:var(--accent); text-decoration:underline;}\n  .task-right{display:flex; align-items:center; gap:6px; flex:none;}\n  .deadline-pill{\n    font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:999px;\n    white-space:nowrap; color:var(--ink-muted); background:var(--surface-2);\n  }\n  .deadline-pill.warn{color:var(--warn); background:var(--warn-soft);}\n  .deadline-pill.critical{color:var(--critical); background:var(--critical-soft);}\n\n  details.add-task{border-top:1px solid var(--line); padding:4px 10px 10px;}\n  details.add-task summary{\n    list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;\n    color:var(--accent); font-weight:600; font-size:13px; padding:8px 6px; border-radius:6px;\n  }\n  details.add-task summary::-webkit-details-marker{display:none;}\n  details.add-task summary:hover{background:var(--accent-soft);}\n  .add-task-form{display:flex; flex-direction:column; gap:8px; padding:8px 6px 2px;}\n  .add-task-form input[type=\"text\"], .add-task-form textarea{\n    font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border:1px solid var(--line);\n    border-radius:6px; background:var(--bg); color:var(--ink); resize:vertical;\n  }\n  .deadline-field{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-muted);}\n  .deadline-field input[type=\"date\"]{\n    font-family:var(--font-mono); font-size:12.5px; padding:5px 8px; border:1px solid var(--line);\n    border-radius:6px; background:var(--bg); color:var(--ink);\n  }\n  .form-actions{display:flex; gap:8px; justify-content:flex-end;}\n\n  .btn{\n    font-family:var(--font-body); font-weight:600; font-size:13.5px; border-radius:7px;\n    padding:8px 16px; cursor:pointer; border:1px solid transparent;\n  }\n  .btn.primary{background:var(--accent-deep); color:#fff;}\n  .btn.primary:hover{background:var(--accent);}\n  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink);}\n  .btn.ghost:hover{background:var(--bg);}\n  .btn.danger{color:var(--critical); border-color:var(--critical-soft);}\n  .btn.danger:hover{background:var(--critical-soft);}\n  .btn.small{padding:6px 12px; font-size:12.5px;}\n\n  .plate.plate-add{align-items:center; justify-content:center; padding:22px; border-style:dashed; background:transparent; box-shadow:none;}\n  .add-group-btn{display:flex; align-items:center; gap:6px;}\n  .plate-add input[type=\"text\"]{\n    width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px;\n    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); margin-bottom:8px;\n  }\n\n  .history-toolbar{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}\n  .history-toolbar select{\n    font-family:var(--font-body); font-size:13px; padding:7px 10px; border:1px solid var(--line);\n    border-radius:7px; background:var(--surface); color:var(--ink);\n  }\n  #history-list{display:flex; flex-direction:column; gap:8px;}\n  .history-row{\n    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line);\n    border-radius:9px; padding:10px 14px; cursor:pointer;\n  }\n  .history-row:hover{border-color:var(--accent);}\n  .status-chip{\n    font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:999px; flex:none;\n    text-transform:uppercase; letter-spacing:.03em;\n  }\n  .status-chip.good{color:var(--good); background:var(--good-soft);}\n  .status-chip.gone{color:var(--gone); background:var(--gone-soft);}\n  .history-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}\n  .history-title{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}\n  .history-group{font-size:12px; color:var(--ink-muted); font-family:var(--font-mono);}\n  .history-dates{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); flex:none;}\n\n  .overlay{\n    position:fixed; inset:0; background:rgba(15,22,32,.45); display:flex; align-items:center;\n    justify-content:center; padding:20px; z-index:50;\n  }\n  .detail-card{\n    background:var(--surface); border-radius:12px; box-shadow:var(--shadow); max-width:480px; width:100%;\n    max-height:86vh; overflow-y:auto; padding:20px 22px 22px;\n  }\n  .detail-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}\n  .detail-group{font-family:var(--font-mono); font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}\n  .detail-title{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 10px; text-wrap:balance;}\n  .detail-desc{font-size:14px; line-height:1.6; color:var(--ink); margin:0 0 14px; white-space:pre-wrap;}\n  .detail-desc.muted{color:var(--ink-muted); font-style:italic;}\n  .detail-meta{display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:18px;}\n  .meta-item{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);}\n  .meta-item.warn{color:var(--warn);}\n  .meta-item.critical{color:var(--critical);}\n  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}\n  .edit-title{font-family:var(--font-body); font-size:18px; font-weight:600; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px;}\n  .edit-desc{width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px; resize:vertical;}\n\n  .toast{\n    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink);\n    color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:60;\n    max-width:90vw; text-align:center;\n  }\n\n  @media (max-width:640px){\n    .topbar{flex-direction:column; align-items:flex-start;}\n    .topbar-right{align-items:flex-start;}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"app\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv class=\"topbar-title\">\n        \u003ch1>Task Manager\u003c/h1>\n        \u003cp>El teu full de ruta — PRISMA · ATLAS · ATLAS X · EA CTTI\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"topbar-right\">\n        \u003cspan id=\"save-status\" class=\"save-status offline\">\u003cspan class=\"dot\">\u003c/span>\u003cspan class=\"save-status-text\">Vista prèvia\u003c/span>\u003c/span>\n        \u003cdiv class=\"topbar-controls\">\n          \u003cdiv class=\"tabs\">\n            \u003cbutton type=\"button\" id=\"tab-pending\" class=\"tab-btn active\">Pendents\u003c/button>\n            \u003cbutton type=\"button\" id=\"tab-history\" class=\"tab-btn\">Historial\u003c/button>\n          \u003c/div>\n          \u003cbutton type=\"button\" id=\"undo-btn\" class=\"btn undo-btn\" hidden>\n            \u003csvg viewBox=\"0 0 20 20\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 8H12.5A3.5 3.5 0 0116 11.5V11.5A3.5 3.5 0 0112.5 15H8\"/>\u003cpath d=\"M8 5L5 8L8 11\"/>\u003c/svg>\n            Desfés\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cdiv id=\"view-pending\" class=\"view\">\n      \u003cdiv class=\"summary-bar\">\n        \u003cspan class=\"summary-chip\">\u003cb id=\"summary-pending\">0\u003c/b>\u003cspan>pendents\u003c/span>\u003c/span>\n        \u003cspan class=\"summary-chip warn\">\u003cb id=\"summary-warn\">0\u003c/b>\u003cspan>a punt de vèncer\u003c/span>\u003c/span>\n        \u003cspan class=\"summary-chip critical\">\u003cb id=\"summary-crit\">0\u003c/b>\u003cspan>endarrerides\u003c/span>\u003c/span>\n        \u003cdiv class=\"tabs view-mode-toggle\">\n          \u003cbutton type=\"button\" id=\"view-cards\" class=\"tab-btn active\">Targetes\u003c/button>\n          \u003cbutton type=\"button\" id=\"view-list\" class=\"tab-btn\">Llista\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"groups\" class=\"groups-grid\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"view-history\" class=\"view\" hidden>\n      \u003cdiv class=\"history-toolbar\">\n        \u003cselect id=\"history-status-filter\">\n          \u003coption value=\"all\">Totes\u003c/option>\n          \u003coption value=\"completed\">Completades\u003c/option>\n          \u003coption value=\"deleted\">Eliminades\u003c/option>\n        \u003c/select>\n        \u003cselect id=\"history-group-filter\">\n          \u003coption value=\"all\">Tots els programes\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv id=\"history-list\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"detail-overlay\" class=\"overlay\" hidden>\n    \u003cdiv id=\"detail-card\" class=\"detail-card\" role=\"dialog\" aria-modal=\"true\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"toast\" class=\"toast\" hidden>\u003c/div>\n\n  \u003cscript type=\"application/json\" id=\"state-data\">@@CTTI_TASKS_STATE@@\u003c/script>\n  \u003cscript>\n    @@CTTI_TASKS_TEMPLATE@@\n\n    var DATA_MARKER = '@@CTTI_TASKS' + '_STATE@@';\n    var BODY_MARKER = '@@CTTI_TASKS' + '_TEMPLATE@@';\n\n    function splitJoin(str, marker, value){ return str.split(marker).join(value); }\n    function escapeForEmbed(s){\n      return s.replace(/\u003c/g, '\\\\u003c').replace(/\\u2028/g, '\\\\u2028').replace(/\\u2029/g, '\\\\u2029');\n    }\n    function fillTemplate(tmpl, st){\n      var json = escapeForEmbed(JSON.stringify(st));\n      var withData = splitJoin(tmpl, DATA_MARKER, json);\n      var literal = escapeForEmbed(JSON.stringify(tmpl));\n      var withTemplate = splitJoin(withData, BODY_MARKER, 'const BODY_TEMPLATE = ' + literal + ';');\n      return withTemplate;\n    }\n\n    var state = null;\n    var currentDetailId = null;\n    var historyFilter = {status:'all', groupId:'all'};\n    var artifactApi = null;\n    var artifactReady = false;\n    var readOnly = false;\n    var LOCAL_STORAGE_KEY = 'ctti_task_manager_state_v1';\n    var hasClaudeRuntime = (typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function');\n\n    function loadInitialState(){\n      var embedded = null;\n      try{ embedded = JSON.parse(document.getElementById('state-data').textContent); }catch(e){ embedded = null; }\n      if(!hasClaudeRuntime){\n        try{\n          var local = localStorage.getItem(LOCAL_STORAGE_KEY);\n          if(local) return JSON.parse(local);\n        }catch(e){}\n      }\n      return embedded || {groups: [], history: []};\n    }\n\n    var ICONS = {\n      check:'\u003csvg viewBox=\"0 0 20 20\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 10.5l4 4 8-9\"/>\u003c/svg>',\n      trash:'\u003csvg viewBox=\"0 0 20 20\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 6h12M8 6V4.5A1.5 1.5 0 019.5 3h1A1.5 1.5 0 0112 4.5V6m-6.5 0l.6 9.4A1.5 1.5 0 007.6 17h4.8a1.5 1.5 0 001.5-1.6L14.5 6\"/>\u003c/svg>',\n      pencil:'\u003csvg viewBox=\"0 0 20 20\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M13.5 3.5l3 3L6 17l-3.5.5L3 14 13.5 3.5z\"/>\u003c/svg>',\n      plus:'\u003csvg viewBox=\"0 0 20 20\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M10 4v12M4 10h12\"/>\u003c/svg>',\n      x:'\u003csvg viewBox=\"0 0 20 20\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\">\u003cpath d=\"M5 5l10 10M15 5L5 15\"/>\u003c/svg>',\n      grip:'\u003csvg viewBox=\"0 0 20 20\" width=\"11\" height=\"11\" fill=\"currentColor\">\u003ccircle cx=\"6\" cy=\"4\" r=\"1.4\"/>\u003ccircle cx=\"6\" cy=\"10\" r=\"1.4\"/>\u003ccircle cx=\"6\" cy=\"16\" r=\"1.4\"/>\u003ccircle cx=\"13\" cy=\"4\" r=\"1.4\"/>\u003ccircle cx=\"13\" cy=\"10\" r=\"1.4\"/>\u003ccircle cx=\"13\" cy=\"16\" r=\"1.4\"/>\u003c/svg>',\n      undo:'\u003csvg viewBox=\"0 0 20 20\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 8H12.5A3.5 3.5 0 0116 11.5V11.5A3.5 3.5 0 0112.5 15H8\"/>\u003cpath d=\"M8 5L5 8L8 11\"/>\u003c/svg>'\n    };\n\n    function el(tag, opts, children){\n      var e = document.createElement(tag);\n      opts = opts || {};\n      Object.keys(opts).forEach(function(k){\n        if(k === 'class') e.className = opts[k];\n        else if(k === 'text') e.textContent = opts[k];\n        else if(k.indexOf('on') === 0 && typeof opts[k] === 'function') e.addEventListener(k.slice(2), opts[k]);\n        else e.setAttribute(k, opts[k]);\n      });\n      (children || []).forEach(function(c){ if(c) e.appendChild(c); });\n      return e;\n    }\n    function iconEl(name){\n      var span = document.createElement('span');\n      span.className = 'icon';\n      span.innerHTML = ICONS[name] || '';\n      span.setAttribute('aria-hidden', 'true');\n      return span;\n    }\n    function genId(prefix){\n      return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n    }\n    function formatDate(isoDateOnly){\n      if(!isoDateOnly) return '';\n      var d = new Date(isoDateOnly + 'T00:00:00');\n      return new Intl.DateTimeFormat('ca-ES', {day:'2-digit', month:'short', year:'numeric'}).format(d);\n    }\n    function deadlineInfo(task){\n      if(!task.deadline) return null;\n      var today = new Date(); today.setHours(0,0,0,0);\n      var dl = new Date(task.deadline + 'T00:00:00');\n      var diffDays = Math.round((dl - today) / 86400000);\n      var label = formatDate(task.deadline);\n      var cls = 'neutral';\n      if(diffDays \u003c 0){ cls = 'critical'; label = 'Endarrerida · ' + label; }\n      else if(diffDays \u003c= 3){ cls = 'warn'; label = (diffDays === 0 ? 'Avui' : diffDays === 1 ? 'Demà' : diffDays + ' dies') + ' · ' + label; }\n      return {label: label, cls: cls};\n    }\n\n    function findTaskLocation(taskId){\n      for(var i = 0; i \u003c state.groups.length; i++){\n        var g = state.groups[i];\n        for(var j = 0; j \u003c g.tasks.length; j++){\n          if(g.tasks[j].id === taskId) return {group: g, task: g.tasks[j], index: j};\n        }\n      }\n      return null;\n    }\n\n    function addTask(groupId, title, description, deadline){\n      var g = state.groups.find(function(x){ return x.id === groupId; });\n      if(!g) return;\n      g.tasks.push({id: genId('t'), title: title, description: description || '', deadline: deadline || null, createdAt: new Date().toISOString()});\n      save();\n    }\n    function resolveTask(taskId, status){\n      var loc = findTaskLocation(taskId);\n      if(!loc) return;\n      loc.group.tasks.splice(loc.index, 1);\n      var entry = {\n        id: loc.task.id, groupId: loc.group.id, groupName: loc.group.name,\n        title: loc.task.title, description: loc.task.description, deadline: loc.task.deadline,\n        createdAt: loc.task.createdAt, resolvedAt: new Date().toISOString(), status: status\n      };\n      state.history.unshift(entry);\n      state.lastResolvedId = entry.id;\n      closeDetail();\n      save();\n    }\n    function completeTask(taskId){ resolveTask(taskId, 'completed'); }\n    function discardTask(taskId){ resolveTask(taskId, 'deleted'); }\n    function restoreFromHistory(historyId){\n      var idx = state.history.findIndex(function(h){ return h.id === historyId; });\n      if(idx === -1) return;\n      var h = state.history[idx];\n      var group = state.groups.find(function(x){ return x.id === h.groupId; });\n      if(!group){\n        showToast('El programa original ja no existeix; no es pot restaurar.');\n        return;\n      }\n      state.history.splice(idx, 1);\n      group.tasks.push({id: h.id, title: h.title, description: h.description, deadline: h.deadline, createdAt: h.createdAt});\n      if(state.lastResolvedId === h.id) state.lastResolvedId = null;\n      closeDetail();\n      save();\n    }\n    function renameGroup(groupId, name){\n      var g = state.groups.find(function(x){ return x.id === groupId; });\n      if(g){ g.name = name; save(); }\n    }\n    function addGroup(name){\n      state.groups.push({id: genId('g'), name: name, tasks: []});\n      save();\n    }\n    function updateTaskFields(taskId, fields){\n      var loc = findTaskLocation(taskId);\n      if(!loc) return;\n      if(fields.title !== undefined) loc.task.title = fields.title;\n      if(fields.description !== undefined) loc.task.description = fields.description;\n      if(fields.deadline !== undefined) loc.task.deadline = fields.deadline;\n      save();\n    }\n\n    function renderAddTaskForm(g){\n      var details = el('details', {class:'add-task'});\n      var summary = el('summary', {}, [iconEl('plus'), document.createTextNode(' Afegeix una tasca')]);\n      details.appendChild(summary);\n      var form = el('form', {class:'add-task-form'});\n      var titleInput = el('input', {type:'text', placeholder:'Títol de la tasca', required:'required', maxlength:'140'});\n      var descInput = el('textarea', {placeholder:'Descripció (opcional)', rows:'2'});\n      var deadlineWrap = el('label', {class:'deadline-field'}, [document.createTextNode('Data límit (opcional)')]);\n      var deadlineInput = el('input', {type:'date'});\n      deadlineWrap.appendChild(deadlineInput);\n      var actions = el('div', {class:'form-actions'});\n      var cancelBtn = el('button', {type:'button', class:'btn ghost small', text:'Cancel·la', onclick: function(){ form.reset(); details.open = false; }});\n      var saveBtn = el('button', {type:'submit', class:'btn primary small', text:'Desa'});\n      actions.appendChild(cancelBtn); actions.appendChild(saveBtn);\n      form.appendChild(titleInput); form.appendChild(descInput); form.appendChild(deadlineWrap); form.appendChild(actions);\n      form.addEventListener('submit', function(ev){\n        ev.preventDefault();\n        var title = titleInput.value.trim();\n        if(!title) return;\n        addTask(g.id, title, descInput.value.trim(), deadlineInput.value || null);\n      });\n      details.appendChild(form);\n      return details;\n    }\n\n    function startRenameGroup(groupId, wrap, currentName){\n      wrap.innerHTML = '';\n      var input = el('input', {type:'text', class:'rename-input', value: currentName, maxlength:'60'});\n      wrap.appendChild(input);\n      input.focus(); input.select();\n      var done = false;\n      function commit(){\n        if(done) return; done = true;\n        var val = input.value.trim();\n        if(val && val !== currentName){ renameGroup(groupId, val); } else { render(); }\n      }\n      input.addEventListener('keydown', function(ev){\n        if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }\n        else if(ev.key === 'Escape'){ done = true; render(); }\n      });\n      input.addEventListener('blur', function(){ commit(); });\n    }\n\n    var dragTaskId = null;\n\n    function clearDropMarkers(){\n      document.querySelectorAll('.drop-before, .drop-after').forEach(function(el2){\n        el2.classList.remove('drop-before', 'drop-after');\n      });\n    }\n    function getDragAfterElement(container, y){\n      var rows = Array.prototype.slice.call(container.querySelectorAll('.task-row:not(.dragging)'));\n      var result = {offset: -Infinity, element: null};\n      rows.forEach(function(row){\n        var box = row.getBoundingClientRect();\n        var offset = y - box.top - box.height / 2;\n        if(offset \u003c 0 && offset > result.offset){ result = {offset: offset, element: row}; }\n      });\n      return result.element;\n    }\n    function moveTask(taskId, targetGroupId, beforeTaskId){\n      if(!taskId) return;\n      var loc = findTaskLocation(taskId);\n      if(!loc) return;\n      var targetGroup = state.groups.find(function(x){ return x.id === targetGroupId; });\n      if(!targetGroup) return;\n      loc.group.tasks.splice(loc.index, 1);\n      var insertIndex = targetGroup.tasks.length;\n      if(beforeTaskId){\n        var idx = targetGroup.tasks.findIndex(function(x){ return x.id === beforeTaskId; });\n        if(idx !== -1) insertIndex = idx;\n      }\n      targetGroup.tasks.splice(insertIndex, 0, loc.task);\n      save();\n    }\n    function wireDropZone(listEl, g){\n      listEl.addEventListener('dragover', function(ev){\n        if(!dragTaskId) return;\n        ev.preventDefault();\n        ev.dataTransfer.dropEffect = 'move';\n        clearDropMarkers();\n        var afterRow = getDragAfterElement(listEl, ev.clientY);\n        if(afterRow){ afterRow.classList.add('drop-before'); }\n        else {\n          var rows = listEl.querySelectorAll('.task-row:not(.dragging)');\n          if(rows.length) rows[rows.length - 1].classList.add('drop-after');\n        }\n      });\n      listEl.addEventListener('drop', function(ev){\n        if(!dragTaskId) return;\n        ev.preventDefault();\n        var afterRow = getDragAfterElement(listEl, ev.clientY);\n        var beforeTaskId = afterRow ? afterRow.getAttribute('data-task-id') : null;\n        moveTask(dragTaskId, g.id, beforeTaskId);\n        clearDropMarkers();\n      });\n    }\n\n    function renderTaskRow(t, g){\n      var row = el('div', {class:'task-row', draggable:'true', 'data-task-id': t.id});\n      var grip = el('span', {class:'drag-handle', 'aria-hidden':'true'}, [iconEl('grip')]);\n      var complete = el('button', {class:'complete-btn', type:'button', title:'Marca com a completada', 'aria-label':'Marca com a completada: ' + t.title, onclick: function(){ completeTask(t.id); }}, [iconEl('check')]);\n      var titleBtn = el('button', {class:'task-title', type:'button'});\n      titleBtn.appendChild(document.createTextNode(t.title));\n      titleBtn.addEventListener('click', function(){ openDetail(t.id); });\n      var right = el('div', {class:'task-right'});\n      var di = deadlineInfo(t);\n      if(di){ right.appendChild(el('span', {class:'deadline-pill ' + di.cls, text: di.label})); }\n      var del = el('button', {class:'icon-btn danger-hover', type:'button', title:'Elimina', 'aria-label':'Elimina: ' + t.title, onclick: function(){ discardTask(t.id); }}, [iconEl('trash')]);\n      right.appendChild(del);\n      row.appendChild(grip); row.appendChild(complete); row.appendChild(titleBtn); row.appendChild(right);\n      row.addEventListener('dragstart', function(ev){\n        dragTaskId = t.id;\n        ev.dataTransfer.effectAllowed = 'move';\n        ev.dataTransfer.setData('text/plain', t.id);\n        setTimeout(function(){ row.classList.add('dragging'); }, 0);\n      });\n      row.addEventListener('dragend', function(){\n        row.classList.remove('dragging');\n        dragTaskId = null;\n        clearDropMarkers();\n      });\n      return row;\n    }\n\n    var GROUP_PALETTE = [\n      {bg:'#E7EAFA', fg:'#5567C4'},\n      {bg:'#E4F3EA', fg:'#4C9B74'},\n      {bg:'#FBE7EF', fg:'#C2688A'},\n      {bg:'#FDEADB', fg:'#CE7E42'},\n      {bg:'#F1E7FA', fg:'#8C68B8'},\n      {bg:'#E1F2F0', fg:'#3E9689'}\n    ];\n    function paletteFor(idx){ return GROUP_PALETTE[idx % GROUP_PALETTE.length]; }\n\n    function renderGroupPanel(g, idx){\n      var pal = paletteFor(idx);\n      var panel = el('div', {class:'plate'});\n      panel.style.borderTopColor = pal.fg;\n      var head = el('div', {class:'plate-head'});\n      head.style.background = pal.bg;\n      var num = el('span', {class:'plate-num', text: String(idx + 1).length \u003c 2 ? '0' + (idx + 1) : String(idx + 1)});\n      num.style.color = pal.fg;\n      num.style.borderColor = pal.fg;\n      var nameWrap = el('div', {class:'plate-name-wrap'});\n      nameWrap.appendChild(el('span', {class:'plate-name', text: g.name}));\n      var renameBtn = el('button', {class:'icon-btn', type:'button', title:'Renombra', 'aria-label':'Renombra el programa ' + g.name, onclick: function(){ startRenameGroup(g.id, nameWrap, g.name); }}, [iconEl('pencil')]);\n      var countBadge = el('span', {class:'count-badge', text: String(g.tasks.length)});\n      head.appendChild(num); head.appendChild(nameWrap); head.appendChild(renameBtn); head.appendChild(countBadge);\n      panel.appendChild(head);\n\n      var list = el('div', {class:'task-list'});\n      if(g.tasks.length === 0){\n        list.appendChild(el('p', {class:'empty-note', text:'Sense tasques pendents.'}));\n      } else {\n        g.tasks.forEach(function(t){ list.appendChild(renderTaskRow(t, g)); });\n      }\n      wireDropZone(list, g);\n      panel.appendChild(list);\n      panel.appendChild(renderAddTaskForm(g));\n      return panel;\n    }\n\n    function promptAddGroup(wrap){\n      wrap.innerHTML = '';\n      var input = el('input', {type:'text', placeholder:'Nom del programa', maxlength:'60'});\n      var actions = el('div', {class:'form-actions'});\n      var cancelBtn = el('button', {class:'btn ghost small', type:'button', text:'Cancel·la', onclick: function(){ render(); }});\n      var saveBtn = el('button', {class:'btn primary small', type:'button', text:'Afegeix', onclick: function(){\n        var name = input.value.trim();\n        if(!name) return;\n        addGroup(name);\n      }});\n      actions.appendChild(cancelBtn); actions.appendChild(saveBtn);\n      wrap.appendChild(input); wrap.appendChild(actions);\n      input.focus();\n    }\n    function renderAddGroupPlate(){\n      var wrap = el('div', {class:'plate plate-add'});\n      wrap.appendChild(el('button', {class:'btn ghost add-group-btn', type:'button', onclick: function(){ promptAddGroup(wrap); }}, [iconEl('plus'), document.createTextNode(' Nou programa')]));\n      return wrap;\n    }\n\n    function renderGroups(){\n      if(state.settings.viewMode === 'list') renderGroupsListView();\n      else renderGroupsCards();\n    }\n    function renderGroupsCards(){\n      var container = document.getElementById('groups');\n      container.className = 'groups-grid';\n      container.innerHTML = '';\n      state.groups.forEach(function(g, idx){ container.appendChild(renderGroupPanel(g, idx)); });\n      container.appendChild(renderAddGroupPlate());\n      updateSummary();\n    }\n    function renderListSection(g, idx){\n      var pal = paletteFor(idx);\n      var section = el('div', {class:'list-section'});\n      var head = el('div', {class:'plate-head'});\n      head.style.background = pal.bg;\n      var num = el('span', {class:'plate-num', text: String(idx + 1).length \u003c 2 ? '0' + (idx + 1) : String(idx + 1)});\n      num.style.color = pal.fg;\n      num.style.borderColor = pal.fg;\n      var nameWrap = el('div', {class:'plate-name-wrap'});\n      nameWrap.appendChild(el('span', {class:'plate-name', text: g.name}));\n      var renameBtn = el('button', {class:'icon-btn', type:'button', title:'Renombra', 'aria-label':'Renombra el ild(el('button', {class:'btn ghost', type:'button', text:'Edita', onclick: function(){ renderDetailEdit(t, g); }}));\n      actions.appendChild(el('button', {class:'btn danger', type:'button', onclick: function(){ discardTask(t.id); }}, [iconEl('trash'), document.createTextNode(' Elimina')]));\n      return actions;\n    }\n    function renderDetail(t, g){\n      var card = document.getElementById('detail-card');\n      card.innerHTML = '';\n      var header = el('div', {class:'detail-header'});\n      header.appendChild(el('span', {class:'detail-group', text: g.name}));\n      header.appendChild(el('button', {class:'icon-btn', type:'button', 'aria-label':'Tanca', onclick: closeDetail}, [iconEl('x')]));\n      card.appendChild(header);\n      card.appendChild(el('h2', {class:'detail-title', text: t.title}));\n      card.appendChild(el('p', {class:'detail-desc' + (t.description ? '' : ' muted'), text: t.description || 'Sense descripció.'}));\n      var meta = el('div', {class:'detail-meta'});\n      meta.appendChild(el('span', {class:'meta-item', text: 'Creada: ' + formatDate(t.createdAt.slice(0,10))}));\n      var di = deadlineInfo(t);\n      meta.appendChild(el('span', {class:'meta-item' + (di ? ' ' + di.cls : ''), text: di ? ('Límit: ' + di.label) : 'Sense data límit'}));\n      card.appendChild(meta);\n      card.appendChild(renderDetailActions(t, g));\n    }\n    function renderDetailEdit(t, g){\n      var card = document.getElementById('detail-card');\n      card.innerHTML = '';\n      var header = el('div', {class:'detail-header'});\n      header.appendChild(el('span', {class:'detail-group', text: g.name}));\n      header.appendChild(el('button', {class:'icon-btn', type:'button', 'aria-label':'Tanca', onclick: closeDetail}, [iconEl('x')]));\n      card.appendChild(header);\n      var titleInput = el('input', {type:'text', class:'edit-title', value: t.title, maxlength:'140'});\n      card.appendChild(titleInput);\n      var descInput = el('textarea', {class:'ed     var DATA_MARKER = '@@CTTI_TASKS' + '_STATE@@';
    var BODY_MARKER = '@@CTTI_TASKS' + '_TEMPLATE@@';

    function el(tag, opts, children){

    function genId(prefix){

    function deadlineInfo(task){

      var cls = 'neutral';
      if(diffDays < 0){ cls = 'critical'; label = 'Endarrerida · ' + label; }

      return {label: label, cls: cls};
    }

    function findTaskLocation(taskId){

          if(g.tasks[j].id === taskId) return {group: g, task: g.tasks[j], index: j};
        }
      }
      return null;
    }

    function addTask(groupId, title, description, deadline){
      var g = state.groups.find(function(x){ return x.id === groupId; });
      if(!g) return;
      g.tasks.push({id: genId('t'), title: title, description: description || '', deadline: deadline || null, createdAt: new Date().toISOString()});
      save();
    }
    function resolveTask(taskId, status){
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      loc.group.tasks.splice(loc.index, 1);
      var entry = {
        id: loc.task.id, groupId: loc.group.id, groupName: loc.group.name,
        title: loc.task.title, description: loc.task.description, deadline: loc.task.deadline,
        createdAt: loc.task.createdAt, resolvedAt: new Date().toISOString(), status: status
      };
      state.history.unshift(entry);
      state.lastResolvedId = entry.id;
      closeDetail();
      save();
    }
    function completeTask(taskId){ resolveTask(taskId, 'completed'); }

    function restoreFromHistory(historyId){

      var h = state.history[idx];

      if(!group){
        showToast('El programa original ja no existeix; no es pot restaurar.');
        return;
      }
      state.history.splice(idx, 1);
      group.tasks.push({id: h.id, title: h.title, description: h.description, deadline: h.deadline, createdAt: h.createdAt});
      if(state.lastResolvedId === h.id) state.lastResolvedId = null;

      save();
    }

    }

      save();
    }
    function updateTaskFields(taskId, fields){
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      if(fields.title !== undefined) loc.task.title = fields.title;
      if(fields.description !== undefined) loc.task.description = fields.description;
      if(fields.deadline !== undefined) loc.task.deadline = fields.deadline;
      save();
    }

    function renderAddTaskForm(g){
      var details = el('details', {class:'add-task'});

      details.appendChild(summary);

      var actions = el('div', {class:'form-actions'});
      var cancelBtn = el('button', {type:'button', class:'btn ghost small', text:'Cancel·la', onclick: function(){ form.reset(); details.open = false; }});
      var saveBtn = el('button', {type:'submit', class:'btn primary small', text:'Desa'});

      form.addEventListener('submit', function(ev){
        ev.preventDefault();

    function startRenameGroup(groupId, wrap, currentName){
      wrap.innerHTML = '';
      var input = el('input', {type:'text', class:'rename-input', value: currentName, maxlength:'60'});

    var dragTaskId = null;

    }
    function getDragAfterElement(container, y){

    function moveTask(taskId, targetGroupId, beforeTaskId){

    function wireDropZone(listEl, g){

        var beforeTaskId = afterRow ? afterRow.getAttribute('data-task-id') : null;
        moveTask(dragTaskId, g.id, beforeTaskId);
        clearDropMarkers();
      });
    }

    function renderTaskRow(t, g){
      var row = el('div', {class:'task-row', draggable:'true', 'data-task-id': t.id});
      var grip = el('span', {class:'drag-handle', 'aria-hidden':'true'}, [iconEl('grip')]);
      var complete = el('button', {class:'complete-btn', type:'button', title:'Marca com a completada', 'aria-label':'Marca com a completada: ' + t.title, onclick: function(){ completeTask(t.id); }}, [iconEl('check')]);
      var titleBtn = el('button', {class:'task-title', type:'button'});
      titleBtn.appendChild(document.createTextNode(t.title));
      titleBtn.addEventListener('click', function(){ openDetail(t.id); });
      var right = el('div', {class:'task-right'});
      var di = deadlineInfo(t);
      if(di){ right.appendChild(el('span', {class:'deadline-pill ' + di.cls, text: di.label})); }
      var del = el('button', {class:'icon-btn danger-hover', type:'button', title:'Elimina', 'aria-label':'Elimina: ' + t.title, onclick: function(){ discardTask(t.id); }}, [iconEl('trash')]);
      right.appendChild(del);
      row.appendChild(grip); row.appendChild(complete); row.appendChild(titleBtn); row.appendChild(right);
      row.addEventListener('dragstart', function(ev){
        dragTaskId = t.id;
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', t.id);
        setTimeout(function(){ row.classList.add('dragging'); }, 0);
      });
      row.addEventListener('dragend', function(){
        row.classList.remove('dragging');
        dragTaskId = null;
        clearDropMarkers();
      });
      return row;
    }

    var GROUP_PALETTE = [
      {bg:'#E7EAFA', fg:'#5567C4'},
      {bg:'#E4F3EA', fg:'#4C9B74'},
      {bg:'#FBE7EF', fg:'#C2688A'},
      {bg:'#FDEADB', fg:'#CE7E42'},
      {bg:'#F1E7FA', fg:'#8C68B8'},
      {bg:'#E1F2F0', fg:'#3E9689'}
    ];
    function paletteFor(idx){ return GROUP_PALETTE[idx % GROUP_PALETTE.length]; }

    function renderGroupPanel(g, idx){
      var pal = paletteFor(idx);
      var panel = el('div', {class:'plate'});
      panel.style.borderTopColor = pal.fg;
      var head = el('div', {class:'plate-head'});
      head.style.background = pal.bg;
      var num = el('span', {class:'plate-num', text: String(idx + 1).length < 2 ? '0' + (idx + 1) : String(idx + 1)});
      num.style.color = pal.fg;
      num.style.borderColor = pal.fg;
      var nameWrap = el('div', {class:'plate-name-wrap'});
      nameWrap.appendChild(el('span', {class:'plate-name', text: g.name}));
      var renameBtn = el('button', {class:'icon-btn', type:'button', title:'Renombra', 'aria-label':'Renombra el programa ' + g.name, onclick: function(){ startRenameGroup(g.id, nameWrap, g.name); }}, [iconEl('pencil')]);
      var countBadge = el('span', {class:'count-badge', text: String(g.tasks.length)});
      head.appendChild(num); head.appendChild(nameWrap); head.appendChild(renameBtn); head.appendChild(countBadge);
      panel.appendChild(head);

      var list = el('div', {class:'task-list'});
      if(g.tasks.length === 0){
        list.appendChild(el('p', {class:'empty-note', text:'Sense tasques pendents.'}));
      } else {
        g.tasks.forEach(function(t){ list.appendChild(renderTaskRow(t, g)); });
      }
      wireDropZone(list, g);
      panel.appendChild(list);
      panel.appendChild(renderAddTaskForm(g));
      return panel;
    }

    function promptAddGroup(wrap){
      wrap.innerHTML = '';
      var input = el('input', {type:'text', placeholder:'Nom del programa', maxlength:'60'});
      var actions = el('div', {class:'form-actions'});
      var cancelBtn = el('button', {class:'btn ghost small', type:'button', text:'Cancel·la', onclick: function(){ render(); }});
      var saveBtn = el('button', {class:'btn primary small', type:'button', text:'Afegeix', onclick: function(){
        var name = input.value.trim();
        if(!name) return;
        addGroup(name);
      }});
      actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
      wrap.appendChild(input); wrap.appendChild(actions);
      input.focus();
    }
    function renderAddGroupPlate(){
      var wrap = el('div', {class:'plate plate-add'});
      wrap.appendChild(el('button', {class:'btn ghost add-group-btn', type:'button', onclick: function(){ promptAddGroup(wrap); }}, [iconEl('plus'), document.createTextNode(' Nou programa')]));
      return wrap;
    }

    function renderGroups(){
      if(state.settings.viewMode === 'list') renderGroupsListView();
      else renderGroupsCards();
    }
    function renderGroupsCards(){
      var container = document.getElementById('groups');
      container.className = 'groups-grid';
      container.innerHTML = '';
      state.groups.forEach(function(g, idx){ container.appendChild(renderGroupPanel(g, idx)); });
      container.appendChild(renderAddGroupPlate());
      updateSummary();
    }
    function renderListSection(g, idx){
      var pal = paletteFor(idx);
      var section = el('div', {class:'list-section'});
      var head = el('div', {class:'plate-head'});
      head.style.background = pal.bg;
      var num = el('span', {class:'plate-num', text: String(idx + 1).length < 2 ? '0' + (idx + 1) : String(idx + 1)});
      num.style.color = pal.fg;
      num.style.borderColor = pal.fg;
      var nameWrap = el('div', {class:'plate-name-wrap'});
      nameWrap.appendChild(el('span', {class:'plate-name', text: g.name}));
      var renameBtn = el('button', {class:'icon-btn', type:'button', title:'Renombra', 'aria-label':'Renombra el programa ' + g.name, onclick: function(){ startRenameGroup(g.id, nameWrap, g.name); }}, [iconEl('pencil')]);
      var countBadge = el('span', {class:'count-badge', text: String(g.tasks.length)});
      head.appendChild(num); head.appendChild(nameWrap); head.appendChild(renameBtn); head.appendChild(countBadge);
      section.appendChild(head);
      var list = el('div', {class:'task-list list-mode'});
      if(g.tasks.length === 0){
        list.appendChild(el('p', {class:'empty-note', text:'Sense tasques pendents.'}));
      } else {
        g.tasks.forEach(function(t){ list.appendChild(renderTaskRow(t, g)); });
      }
      wireDropZone(list, g);
      section.appendChild(list);
      section.appendChild(renderAddTaskForm(g));
      return section;
    }
    function renderGroupsListView(){
      var container = document.getElementById('groups');
      container.className = 'groups-list';
      container.innerHTML = '';
      state.groups.forEach(function(g, idx){ container.appendChild(renderListSection(g, idx)); });
      container.appendChild(renderAddGroupPlate());
      updateSummary();
    }
    function updateSummary(){
      var pending = 0, warn = 0, crit = 0;
      state.groups.forEach(function(g){
        pending += g.tasks.length;
        g.tasks.forEach(function(t){
          var di = deadlineInfo(t);
          if(di){ if(di.cls === 'critical') crit++; else if(di.cls === 'warn') warn++; }
        });
      });
      document.getElementById('summary-pending').textContent = pending;
      document.getElementById('summary-warn').textContent = warn;
      document.getElementById('summary-crit').textContent = crit;
    }

    function renderDetailActions(t, g){
      var actions = el('div', {class:'detail-actions'});
      actions.appendChild(el('button', {class:'btn primary', type:'button', onclick: function(){ completeTask(t.id); }}, [iconEl('check'), document.createTextNode(' Completa')]));
      actions.appendChild(el('button', {class:'btn ghost', type:'button', text:'Edita', onclick: function(){ renderDetailEdit(t, g); }}));
      actions.appendChild(el('button', {class:'btn danger', type:'button', onclick: function(){ discardTask(t.id); }}, [iconEl('trash'), document.createTextNode(' Elimina')]));
      return actions;
    }
    function renderDetail(t, g){
      var card = document.getElementById('detail-card');
      card.innerHTML = '';
      var header = el('div', {class:'detail-header'});
      header.appendChild(el('span', {class:'detail-group', text: g.name}));
      header.appendChild(el('button', {class:'icon-btn', type:'button', 'aria-label':'Tanca', onclick: closeDetail}, [iconEl('x')]));
      card.appendChild(header);
      card.appendChild(el('h2', {class:'detail-title', text: t.title}));
      card.appendChild(el('p', {class:'detail-desc' + (t.description ? '' : ' muted'), text: t.description || 'Sense descripció.'}));
      var meta = el('div', {class:'detail-meta'});
      meta.appendChild(el('span', {class:'meta-item', text: 'Creada: ' + formatDate(t.createdAt.slice(0,10))}));
      var di = deadlineInfo(t);
      meta.appendChild(el('span', {class:'meta-item' + (di ? ' ' + di.cls : ''), text: di ? ('Límit: ' + di.label) : 'Sense data límit'}));
      card.appendChild(meta);
      card.appendChild(renderDetailActions(t, g));
    }
    function renderDetailEdit(t, g){
      var card = document.getElementById('detail-card');
      card.innerHTML = '';
      var header = el('div', {class:'detail-header'});
      header.appendChild(el('span', {class:'detail-group', text: g.name}));
      header.appendChild(el('button', {class:'icon-btn', type:'button', 'aria-label':'Tanca', onclick: closeDetail}, [iconEl('x')]));
      card.appendChild(header);
      var titleInput = el('input', {type:'text', class:'edit-title', value: t.title, maxlength:'140'});
      card.appendChild(titleInput);
      var descInput = el('textarea', {class:'edit-desc', rows:'3', placeholder:'Descripció (opcional)'});
      descInput.value = t.description || '';
      card.appendChild(descInput);
      var deadlineLabel = el('label', {class:'deadline-field'}, [document.createTextNode('Data límit')]);
      var deadlineInput = el('input', {type:'date'});
      if(t.deadline) deadlineInput.value = t.deadline;
      deadlineLabel.appendChild(deadlineInput);
      card.appendChild(deadlineLabel);
      var actions = el('div', {class:'detail-actions'});
      actions.appendChild(el('button', {class:'btn ghost', type:'button', text:'Cancel·la', onclick: function(){ renderDetail(t, g); }}));
      actions.appendChild(el('button', {class:'btn primary', type:'button', text:'Desa els canvis', onclick: function(){
        updateTaskFields(t.id, {title: titleInput.value.trim() || t.title, description: descInput.value.trim(), deadline: deadlineInput.value || null});
        closeDetail();
      }}));
      card.appendChild(actions);
    }
    function openDetail(taskId){
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      currentDetailId = taskId;
      renderDetail(loc.task, loc.group);
      document.getElementById('detail-overlay').hidden = false;
    }
    function openHistoryDetail(h){
      var card = document.getElementById('detail-card');
      card.innerHTML = '';
      var header = el('div', {class:'detail-header'});
      header.appendChild(el('span', {class:'detail-group', text: h.groupName}));
      header.appendChild(el('button', {class:'icon-btn', type:'button', 'aria-label':'Tanca', onclick: closeDetail}, [iconEl('x')]));
      card.appendChild(header);
      card.appendChild(el('h2', {class:'detail-title', text: h.title}));
      card.appendChild(el('p', {class:'detail-desc' + (h.description ? '' : ' muted'), text: h.description || 'Sense descripció.'}));
      var meta = el('div', {class:'detail-meta'});
      meta.appendChild(el('span', {class:'meta-item', text: 'Creada: ' + formatDate(h.createdAt.slice(0,10))}));
      meta.appendChild(el('span', {class:'meta-item', text: (h.status === 'completed' ? 'Completada: ' : 'Eliminada: ') + formatDate(h.resolvedAt.slice(0,10))}));
      card.appendChild(meta);
      var actions = el('div', {class:'detail-actions'});
      actions.appendChild(el('button', {class:'btn primary', type:'button', onclick: function(){ restoreFromHistory(h.id); }}, [iconEl('undo'), document.createTextNode(' Restaura al programa')]));
      card.appendChild(actions);
      document.getElementById('detail-overlay').hidden = false;
    }
    function closeDetail(){
      currentDetailId = null;
      document.getElementById('detail-overlay').hidden = true;
    }

    function populateHistoryGroupFilter(){
      var sel = document.getElementById('history-group-filter');
      var current = sel.value || 'all';
      sel.innerHTML = '';
      sel.appendChild(el('option', {value:'all', text:'Tots els programes'}));
      state.groups.forEach(function(g){ sel.appendChild(el('option', {value:g.id, text:g.name})); });
      sel.value = current;
    }
    function renderHistory(){
      populateHistoryGroupFilter();
      var list = document.getElementById('history-list');
      list.innerHTML = '';
      var items = state.history.filter(function(h){
        if(historyFilter.status !== 'all' && h.status !== historyFilter.status) return false;
        if(historyFilter.groupId !== 'all' && h.groupId !== historyFilter.groupId) return false;
        return true;
      });
      if(items.length === 0){
        list.appendChild(el('p', {class:'empty-note', text:'Sense registres per mostrar.'}));
        return;
      }
      items.forEach(function(h){
        var row = el('div', {class:'history-row', tabindex:'0'});
        row.appendChild(el('span', {class:'status-chip ' + (h.status === 'completed' ? 'good' : 'gone'), text: h.status === 'completed' ? 'Completada' : 'Eliminada'}));
        var main = el('div', {class:'history-main'});
        main.appendChild(el('span', {class:'history-title', text: h.title}));
        main.appendChild(el('span', {class:'history-group', text: h.groupName}));
        row.appendChild(main);
        var dates = el('div', {class:'history-dates'});
        dates.appendChild(el('span', {text: 'Creada ' + formatDate(h.createdAt.slice(0,10))}));
        dates.appendChild(el('span', {text: (h.status === 'completed' ? 'Completada ' : 'Eliminada ') + formatDate(h.resolvedAt.slice(0,10))}));
        row.appendChild(dates);
        var restoreBtn = el('button', {class:'icon-btn', type:'button', title:'Restaura al programa', 'aria-label':'Restaura al programa: ' + h.title, onclick: function(ev){ ev.stopPropagation(); restoreFromHistory(h.id); }}, [iconEl('undo')]);
        row.appendChild(restoreBtn);
        row.addEventListener('click', function(){ openHistoryDetail(h); });
        list.appendChild(row);
      });
    }

    function showView(name){
      document.getElementById('view-pending').hidden = name !== 'pending';
      document.getElementById('view-history').hidden = name !== 'history';
      document.getElementById('tab-pending').classList.toggle('active', name === 'pending');
      document.getElementById('tab-history').classList.toggle('active', name === 'history');
      if(name === 'history') renderHistory();
    }

    function render(){
      renderGroups();
      if(!document.getElementById('view-history').hidden) renderHistory();
      updateUndoControl();
    }

    var toastTimer = null;
    function showToast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ t.hidden = true; }, 4200);
    }
    function updateUndoControl(){
      var btn = document.getElementById('undo-btn');
      if(state.lastResolvedId){
        var h = state.history.find(function(x){ return x.id === state.lastResolvedId; });
        if(h){
          btn.hidden = false;
          btn.title = 'Restaura: ' + h.title;
          return;
        }
      }
      btn.hidden = true;
    }
    function setSaveStatus(mode){
      var s = document.getElementById('save-status');
      var text = s.querySelector('.save-status-text');
      if(mode === 'live'){ s.classList.remove('offline'); text.textContent = 'Desat automàticament'; }
      else if(mode === 'local'){ s.classList.remove('offline'); text.textContent = 'Desat en aquest navegador'; }
      else if(mode === 'readonly'){ s.classList.add('offline'); text.textContent = 'Només lectura'; }
      else { s.classList.add('offline'); text.textContent = 'Vista prèvia'; }
    }

    function initPersistence(){
      if(!hasClaudeRuntime){
        setSaveStatus('local');
        return;
      }
      window.claude.use('artifact').then(function(api){
        artifactReady = true;
        artifactApi = api;
        setSaveStatus(api ? 'live' : 'local');
      });
    }
    function save(){
      render();
      if(artifactApi){
        var html = fillTemplate(BODY_TEMPLATE, state);
        artifactApi.publish(html).catch(function(err){
          if(!err) return;
          if(err.code === 'conflict') return;
          if(err.code === 'not_writer' || err.code === 'not_granted'){
            readOnly = true;
            setSaveStatus('readonly');
            showToast('Aquesta vista és de només lectura.');
            return;
          }
          showToast('No s\'ha pogut desar el canvi. Torna-ho a provar.');
        });
        return;
      }
      if(artifactReady){
        showToast('Aquesta vista no pot desar canvis.');
        return;
      }
      try{
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
        setSaveStatus('local');
      }catch(e){
        setSaveStatus('preview');
        showToast('Aquest navegador no permet desar les dades.');
      }
    }

    function setViewMode(mode){
      state.settings.viewMode = mode;
      document.getElementById('view-cards').classList.toggle('active', mode === 'cards');
      document.getElementById('view-list').classList.toggle('active', mode === 'list');
      save();
    }

    document.addEventListener('DOMContentLoaded', function(){
      state = loadInitialState();
      if(!state.groups) state.groups = [];
      if(!state.history) state.history = [];
      if(!state.settings) state.settings = {};
      if(!state.settings.viewMode) state.settings.viewMode = 'cards';
      document.getElementById('view-cards').classList.toggle('active', state.settings.viewMode === 'cards');
      document.getElementById('view-list').classList.toggle('active', state.settings.viewMode === 'list');
      document.getElementById('view-cards').addEventListener('click', function(){ setViewMode('cards'); });
      document.getElementById('view-list').addEventListener('click', function(){ setViewMode('list'); });

      document.getElementById('tab-pending').addEventListener('click', function(){ showView('pending'); });
      document.getElementById('tab-history').addEventListener('click', function(){ showView('history'); });
      document.getElementById('detail-overlay').addEventListener('click', function(ev){ if(ev.target.id === 'detail-overlay') closeDetail(); });
      document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && !document.getElementById('detail-overlay').hidden) closeDetail(); });
      document.getElementById('history-status-filter').addEventListener('change', function(ev){ historyFilter.status = ev.target.value; renderHistory(); });
      document.getElementById('history-group-filter').addEventListener('change', function(ev){ historyFilter.groupId = ev.target.value; renderHistory(); });
      document.getElementById('undo-btn').addEventListener('click', function(){
        if(state.lastResolvedId) restoreFromHistory(state.lastResolvedId);
      });

      render();
      initPersistence();
    });
  </script>
</body>
</html>
