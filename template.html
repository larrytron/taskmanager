<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7inIU8L3RleHQ+PC9zdmc+">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#E7F1FB; --surface:#FFFFFF; --surface-2:#DBEAF8;
    --ink:#22303F; --ink-muted:#5E7385; --line:#CBDFF0;
    --accent:#5B6FD6; --accent-deep:#3E4FB0; --accent-soft:#E7E9FA;
    --warn:#C98A2E; --warn-soft:#FBF0DC;
    --critical:#C25B4A; --critical-soft:#FBE4DF;
    --good:#4C9B74; --good-soft:#E3F4EA;
    --gone:#9B6B95; --gone-soft:#F3E7F1;
    --shadow:0 1px 2px rgba(43,49,66,.06), 0 8px 24px rgba(43,49,66,.07);
    --radius:10px;
    --font-display:"Manrope","Segoe UI",sans-serif;
    --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1B29; --surface:#16273A; --surface-2:#1B3049;
      --ink:#E6EEF6; --ink-muted:#8FA3B6; --line:#264363;
      --accent:#8B98E8; --accent-deep:#5B6FD6; --accent-soft:#262C48;
      --warn:#E3AD5C; --warn-soft:#3B2E1C;
      --critical:#E58B7B; --critical-soft:#3B241F;
      --good:#7FCBA0; --good-soft:#1E3327;
      --gone:#C79BC1; --gone-soft:#332639;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1B29; --surface:#16273A; --surface-2:#1B3049;
    --ink:#E6EEF6; --ink-muted:#8FA3B6; --line:#264363;
    --accent:#8B98E8; --accent-deep:#5B6FD6; --accent-soft:#262C48;
    --warn:#E3AD5C; --warn-soft:#3B2E1C;
    --critical:#E58B7B; --critical-soft:#3B241F;
    --good:#7FCBA0; --good-soft:#1E3327;
    --gone:#C79BC1; --gone-soft:#332639;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  #app{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}

  .topbar{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:2px solid var(--ink);
  }
  .topbar-title{display:flex; flex-direction:column; gap:2px;}
  .topbar-title h1{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(30px,5vw,42px); margin:0; color:var(--ink);
    text-wrap:balance;
  }
  .topbar-title p{margin:0; color:var(--ink-muted); font-size:13px; font-family:var(--font-mono);}
  .topbar-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .topbar-controls{display:flex; align-items:center; gap:8px;}
  .undo-btn{
    display:flex; align-items:center; gap:6px; font-size:12.5px; padding:8px 14px;
    background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-deep);
  }
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:999px;}
  .tab-btn{
    font-family:var(--font-body); font-weight:600; font-size:13px; letter-spacing:.02em;
    border:none; background:transparent; color:var(--ink-muted); padding:7px 16px;
    border-radius:999px; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent-deep); color:#fff;}
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .save-status{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:6px;}
  .save-status .dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none;}
  .save-status.offline .dot{background:var(--ink-muted);}

  .summary-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px;}
  .view-mode-toggle{margin-left:auto;}
  .summary-chip{
    display:flex; align-items:baseline; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; box-shadow:var(--shadow);
  }
  .summary-chip b{font-family:var(--font-mono); font-size:16px;}
  .summary-chip span{font-size:12px; color:var(--ink-muted);}
  .summary-chip.warn b{color:var(--warn);}
  .summary-chip.critical b{color:var(--critical);}

  .groups-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px;
    align-items:start;
  }
  .groups-list{display:flex; flex-direction:column; gap:14px;}
  .list-section{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .plate{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    border-top:4px solid var(--accent);
    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  }
  .plate-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:var(--surface-2); border-bottom:1px solid var(--line);
  }
  .plate-num{
    font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:500;
    border:1px solid var(--accent); border-radius:4px; padding:2px 6px; flex:none;
  }
  .plate-name-wrap{flex:1; min-width:0;}
  .plate-name{
    font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:0;
    color:var(--ink); display:block;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rename-input{
    font-family:var(--font-display); font-weight:600; font-size:20px;
    width:100%; border:1px solid var(--accent); border-radius:4px; background:var(--surface);
    color:var(--ink); padding:2px 6px;
  }
  .count-badge{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);
    background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 8px; flex:none;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--ink-muted); cursor:pointer;
    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:hover{background:var(--bg); color:var(--ink);}
  .icon-btn.danger-hover:hover{background:var(--critical-soft); color:var(--critical);}

  .task-list{
    display:flex; flex-direction:column; padding:6px 8px;
    max-height:360px; overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .task-list.list-mode{max-height:none; overflow-y:visible;}
  .empty-note{color:var(--ink-muted); font-size:13px; padding:12px 10px; margin:0;}
  .task-row{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px;
  }
  .task-row:hover{background:var(--bg);}
  .task-row.dragging{opacity:.35;}
  .task-row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent);}
  .task-row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent);}
  .drag-handle{
    display:flex; align-items:center; justify-content:center; flex:none;
    width:16px; color:var(--ink-muted); opacity:.45; cursor:grab;
  }
  .task-row:hover .drag-handle{opacity:.9;}
  .drag-handle:active{cursor:grabbing;}
  .complete-btn{
    width:18px; height:18px; border-radius:50%; border:1.4px solid var(--ink-muted);
    background:transparent; color:transparent; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .complete-btn:hover{border-color:var(--good); color:var(--good); background:var(--good-soft);}
  .task-title{
    flex:1; min-width:0; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--ink); font-family:var(--font-body); font-size:14.5px; font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 0;
  }
  .task-title:hover{color:var(--accent); text-decoration:underline;}
  .task-right{display:flex; align-items:center; gap:6px; flex:none;}
  .deadline-pill{
    font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:999px;
    white-space:nowrap; color:var(--ink-muted); background:var(--surface-2);
  }
  .deadline-pill.warn{color:var(--warn); background:var(--warn-soft);}
  .deadline-pill.critical{color:var(--critical); background:var(--critical-soft);}

  details.add-task{border-top:1px solid var(--line); padding:4px 10px 10px;}
  details.add-task summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;
    color:var(--accent); font-weight:600; font-size:13px; padding:8px 6px; border-radius:6px;
  }
  details.add-task summary::-webkit-details-marker{display:none;}
  details.add-task summary:hover{background:var(--accent-soft);}
  .add-task-form{display:flex; flex-direction:column; gap:8px; padding:8px 6px 2px;}
  .add-task-form input[type="text"], .add-task-form textarea{
    font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink); resize:vertical;
  }
  .deadline-field{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-muted);}
  .deadline-field input[type="date"]{
    font-family:var(--font-mono); font-size:12.5px; padding:5px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink);
  }
  .form-actions{display:flex; gap:8px; justify-content:flex-end;}

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px; border-radius:7px;
    padding:8px 16px; cursor:pointer; border:1px solid transparent;
  }
  .btn.primary{background:var(--accent-deep); color:#fff;}
  .btn.primary:hover{background:var(--accent);}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.danger{color:var(--critical); border-color:var(--critical-soft);}
  .btn.danger:hover{background:var(--critical-soft);}
  .btn.small{padding:6px 12px; font-size:12.5px;}

  .plate.plate-add{align-items:center; justify-content:center; padding:22px; border-style:dashed; background:transparent; box-shadow:none;}
  .add-group-btn{display:flex; align-items:center; gap:6px;}
  .plate-add input[type="text"]{
    width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); margin-bottom:8px;
  }

  .history-toolbar{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .history-toolbar select{
    font-family:var(--font-body); font-size:13px; padding:7px 10px; border:1px solid var(--line);
    border-radius:7px; background:var(--surface); color:var(--ink);
  }
  #history-list{display:flex; flex-direction:column; gap:8px;}
  .history-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:10px 14px; cursor:pointer;
  }
  .history-row:hover{border-color:var(--accent);}
  .status-chip{
    font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:999px; flex:none;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .status-chip.good{color:var(--good); background:var(--good-soft);}
  .status-chip.gone{color:var(--gone); background:var(--gone-soft);}
  .history-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .history-title{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-group{font-size:12px; color:var(--ink-muted); font-family:var(--font-mono);}
  .history-dates{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); flex:none;}

  .overlay{
    position:fixed; inset:0; background:rgba(15,22,32,.45); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .detail-card{
    background:var(--surface); border-radius:12px; box-shadow:var(--shadow); max-width:480px; width:100%;
    max-height:86vh; overflow-y:auto; padding:20px 22px 22px;
  }
  .detail-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .detail-group{font-family:var(--font-mono); font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
  .detail-title{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 10px; text-wrap:balance;}
  .detail-desc{font-size:14px; line-height:1.6; color:var(--ink); margin:0 0 14px; white-space:pre-wrap;}
  .detail-desc.muted{color:var(--ink-muted); font-style:italic;}
  .detail-meta{display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:18px;}
  .meta-item{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted);}
  .meta-item.warn{color:var(--warn);}
  .meta-item.critical{color:var(--critical);}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .edit-title{font-family:var(--font-body); font-size:18px; font-weight:600; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px;}
  .edit-desc{width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); margin-bottom:10px; resize:vertical;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:60;
    max-width:90vw; text-align:center;
  }

  @media (max-width:640px){
    .topbar{flex-direction:column; align-items:flex-start;}
    .topbar-right{align-items:flex-start;}
  }
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Task Manager</h1>
        <p>El teu full de ruta — PRISMA · ATLAS · ATLAS X · EA CTTI</p>
      </div>
      <div class="topbar-right">
        <span id="save-status" class="save-status offline"><span class="dot"></span><span class="save-status-text">Vista prèvia</span></span>
        <div class="topbar-controls">
          <div class="tabs">
            <button type="button" id="tab-pending" class="tab-btn active">Pendents</button>
            <button type="button" id="tab-history" class="tab-btn">Historial</button>
          </div>
          <button type="button" id="undo-btn" class="btn undo-btn" hidden>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8H12.5A3.5 3.5 0 0116 11.5V11.5A3.5 3.5 0 0112.5 15H8"/><path d="M8 5L5 8L8 11"/></svg>
            Desfés
          </button>
        </div>
      </div>
    </header>

    <div id="view-pending" class="view">
      <div class="summary-bar">
        <span class="summary-chip"><b id="summary-pending">0</b><span>pendents</span></span>
        <span class="summary-chip warn"><b id="summary-warn">0</b><span>a punt de vèncer</span></span>
        <span class="summary-chip critical"><b id="summary-crit">0</b><span>endarrerides</span></span>
        <div class="tabs view-mode-toggle">
          <button type="button" id="view-cards" class="tab-btn active">Targetes</button>
          <button type="button" id="view-list" class="tab-btn">Llista</button>
        </div>
      </div>
      <div id="groups" class="groups-grid"></div>
    </div>

    <div id="view-history" class="view" hidden>
      <div class="history-toolbar">
        <select id="history-status-filter">
          <option value="all">Totes</option>
          <option value="completed">Completades</option>
          <option value="deleted">Eliminades</option>
        </select>
        <select id="history-group-filter">
          <option value="all">Tots els programes</option>
        </select>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="detail-overlay" class="overlay" hidden>
    <div id="detail-card" class="detail-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="application/json" id="state-data">@@CTTI_TASKS_STATE@@</script>
  <script>
    @@CTTI_TASKS_TEMPLATE@@

    var DATA_MARKER = '@@CTTI_TASKS' + '_STATE@@';
    var BODY_MARKER = '@@CTTI_TASKS' + '_TEMPLATE@@';

    function splitJoin(str, marker, value){ return str.split(marker).join(value); }
    function escapeForEmbed(s){
      return s.replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    }
    function fillTemplate(tmpl, st){
      var json = escapeForEmbed(JSON.stringify(st));
      var withData = splitJoin(tmpl, DATA_MARKER, json);
      var literal = escapeForEmbed(JSON.stringify(tmpl));
      var withTemplate = splitJoin(withData, BODY_MARKER, 'const BODY_TEMPLATE = ' + literal + ';');
      return withTemplate;
    }

    var state = null;
    var currentDetailId = null;
    var historyFilter = {status:'all', groupId:'all'};
    var artifactApi = null;
    var artifactReady = false;
    var readOnly = false;
    var LOCAL_STORAGE_KEY = 'ctti_task_manager_state_v1';
    var hasClaudeRuntime = (typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function');

    function loadInitialState(){
      var embedded = null;
      try{ embedded = JSON.parse(document.getElementById('state-data').textContent); }catch(e){ embedded = null; }
      if(!hasClaudeRuntime){
        try{
          var local = localStorage.getItem(LOCAL_STORAGE_KEY);
          if(local) return JSON.parse(local);
        }catch(e){}
      }
      return embedded || {groups: [], history: []};
    }

    var ICONS = {
      check:'<svg viewBox="0 0 20 20" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>',
      trash:'<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 019.5 3h1A1.5 1.5 0 0112 4.5V6m-6.5 0l.6 9.4A1.5 1.5 0 007.6 17h4.8a1.5 1.5 0 001.5-1.6L14.5 6"/></svg>',
      pencil:'<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l3 3L6 17l-3.5.5L3 14 13.5 3.5z"/></svg>',
      plus:'<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>',
      x:'<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>',
      grip:'<svg viewBox="0 0 20 20" width="11" height="11" fill="currentColor"><circle cx="6" cy="4" r="1.4"/><circle cx="6" cy="10" r="1.4"/><circle cx="6" cy="16" r="1.4"/><circle cx="13" cy="4" r="1.4"/><circle cx="13" cy="10" r="1.4"/><circle cx="13" cy="16" r="1.4"/></svg>',
      undo:'<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8H12.5A3.5 3.5 0 0116 11.5V11.5A3.5 3.5 0 0112.5 15H8"/><path d="M8 5L5 8L8 11"/></svg>'
    };

    function el(tag, opts, children){
      var e = document.createElement(tag);
      opts = opts || {};
      Object.keys(opts).forEach(function(k){
        if(k === 'class') e.className = opts[k];
        else if(k === 'text') e.textContent = opts[k];
        else if(k.indexOf('on') === 0 && typeof opts[k] === 'function') e.addEventListener(k.slice(2), opts[k]);
        else e.setAttribute(k, opts[k]);
      });
      (children || []).forEach(function(c){ if(c) e.appendChild(c); });
      return e;
    }
    function iconEl(name){
      var span = document.createElement('span');
      span.className = 'icon';
      span.innerHTML = ICONS[name] || '';
      span.setAttribute('aria-hidden', 'true');
      return span;
    }
    function genId(prefix){
      return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }
    function formatDate(isoDateOnly){
      if(!isoDateOnly) return '';
      var d = new Date(isoDateOnly + 'T00:00:00');
      return new Intl.DateTimeFormat('ca-ES', {day:'2-digit', month:'short', year:'numeric'}).format(d);
    }
    function deadlineInfo(task){
      if(!task.deadline) return null;
      var today = new Date(); today.setHours(0,0,0,0);
      var dl = new Date(task.deadline + 'T00:00:00');
      var diffDays = Math.round((dl - today) / 86400000);
      var label = formatDate(task.deadline);
      var cls = 'neutral';
      if(diffDays < 0){ cls = 'critical'; label = 'Endarrerida · ' + label; }
      else if(diffDays <= 3){ cls = 'warn'; label = (diffDays === 0 ? 'Avui' : diffDays === 1 ? 'Demà' : diffDays + ' dies') + ' · ' + label; }
      return {label: label, cls: cls};
    }

    function findTaskLocation(taskId){
      for(var i = 0; i < state.groups.length; i++){
        var g = state.groups[i];
        for(var j = 0; j < g.tasks.length; j++){
          if(g.tasks[j].id === taskId) return {group: g, task: g.tasks[j], index: j};
        }
      }
      return null;
    }

    function addTask(groupId, title, description, deadline){
      var g = state.groups.find(function(x){ return x.id === groupId; });
      if(!g) return;
      g.tasks.push({id: genId('t'), title: title, description: description || '', deadline: deadline || null, createdAt: new Date().toISOString()});
      save();
    }
    function resolveTask(taskId, status){
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      loc.group.tasks.splice(loc.index, 1);
      var entry = {
        id: loc.task.id, groupId: loc.group.id, groupName: loc.group.name,
        title: loc.task.title, description: loc.task.description, deadline: loc.task.deadline,
        createdAt: loc.task.createdAt, resolvedAt: new Date().toISOString(), status: status
      };
      state.history.unshift(entry);
      state.lastResolvedId = entry.id;
      closeDetail();
      save();
    }
    function completeTask(taskId){ resolveTask(taskId, 'completed'); }
    function discardTask(taskId){ resolveTask(taskId, 'deleted'); }
    function restoreFromHistory(historyId){
      var idx = state.history.findIndex(function(h){ return h.id === historyId; });
      if(idx === -1) return;
      var h = state.history[idx];
      var group = state.groups.find(function(x){ return x.id === h.groupId; });
      if(!group){
        showToast('El programa original ja no existeix; no es pot restaurar.');
        return;
      }
      state.history.splice(idx, 1);
      group.tasks.push({id: h.id, title: h.title, description: h.description, deadline: h.deadline, createdAt: h.createdAt});
      if(state.lastResolvedId === h.id) state.lastResolvedId = null;
      closeDetail();
      save();
    }
    function renameGroup(groupId, name){
      var g = state.groups.find(function(x){ return x.id === groupId; });
      if(g){ g.name = name; save(); }
    }
    function addGroup(name){
      state.groups.push({id: genId('g'), name: name, tasks: []});
      save();
    }
    function updateTaskFields(taskId, fields){
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      if(fields.title !== undefined) loc.task.title = fields.title;
      if(fields.description !== undefined) loc.task.description = fields.description;
      if(fields.deadline !== undefined) loc.task.deadline = fields.deadline;
      save();
    }

    function startRenameGroup(groupId, wrap, currentName){
      wrap.innerHTML = '';
      var input = el('input', {type:'text', class:'rename-input', value: currentName, maxlength:'60'});
      wrap.appendChild(input);
      input.focus(); input.select();
      var done = false;
      function commit(){
        if(done) return; done = true;
        var val = input.value.trim();
        if(val && val !== currentName){ renameGroup(groupId, val); } else { render(); }
      }
      input.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
        else if(ev.key === 'Escape'){ done = true; render(); }
      });
      input.addEventListener('blur', function(){ commit(); });
    }

    var dragTaskId = null;

    function clearDropMarkers(){
      document.querySelectorAll('.drop-before, .drop-after').forEach(function(el2){
        el2.classList.remove('drop-before', 'drop-after');
      });
    }
    function getDragAfterElement(container, y){
      var rows = Array.prototype.slice.call(container.querySelectorAll('.task-row:not(.dragging)'));
      var result = {offset: -Infinity, element: null};
      rows.forEach(function(row){
        var box = row.getBoundingClientRect();
        var offset = y - box.top - box.height / 2;
        if(offset < 0 && offset > result.offset){ result = {offset: offset, element: row}; }
      });
      return result.element;
    }
    function moveTask(taskId, targetGroupId, beforeTaskId){
      if(!taskId) return;
      var loc = findTaskLocation(taskId);
      if(!loc) return;
      var targetGroup = state.groups.find(function(x){ return x.id === targetGroupId; });
      if(!targetGroup) return;
      loc.group.tasks.splice(loc.index, 1);
      var insertIndex = targetGroup.tasks.length;
      if(beforeTaskId){
        var idx = targetGroup.tasks.findIndex(function(x){ return x.id === beforeTaskId; });
        if(idx !== -1) insertIndex = idx;
      }
      targetGroup.tasks.splice(insertIndex, 0, loc.task);
      save();
    }
    function wireDropZone(listEl, g){
      listEl.addEventListener('dragover', function(ev){
        if(!dragTaskId) return;
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'move';
        clearDropMarkers();
        var afterRow = getDragAfterElement(listEl, ev.clientY);
        if(afterRow){ afterRow.classList.add('drop-before'); }
        else {
          var rows = listEl.querySelectorAll('.task-row:not(.dragging)');
          if(rows.length) rows[rows.length - 1].classList.add('drop-after');
        }
      });
      listEl.addEventListener('drop', function(ev){
        if(!dragTaskId) return;
        ev.preventDefault();
        var afterRow = getDragAfterElement(listEl, ev.clientY);
        var beforeTaskId = afterRow ? afterRow.getAttribute('data-task-id') : null;
        moveTask(dragTaskId, g.id, beforeTaskId);
        clearDropMarkers();
      });
    }

      right.appendChild(del);
      row.appendChild(grip); row.appendChild(complete); row.appendChild(titleBtn); row.appendChild(right);

        setTimeout(function(){ row.classList.add('dragging'); }, 0);

      row.addEventListener('dragend', function(){

        clearDropMarkers();
      });
      return row;
    }

    function setSaveStatus(mode){
      var s = document.getElementById('save-status');
      var text = s.querySelector('.save-status-text');
      if(mode === 'live'){ s.classList.remove('offline'); text.textContent = 'Desat automàticament'; }
      else if(mode === 'local'){ s.classList.remove('offline'); text.textContent = 'Desat en aquest navegador'; }
      else if(mode === 'readonly'){ s.classList.add('offline'); text.textContent = 'Només lectura'; }
      else { s.classList.add('offline'); text.textContent = 'Vista prèvia'; }
    }

    function initPersistence(){
      if(!hasClaudeRuntime){
        setSaveStatus('local');
        return;
      }
      window.claude.use('artifact').then(function(api){
        artifactReady = true;
        artifactApi = api;
        setSaveStatus(api ? 'live' : 'local');
      });
    }
    function save(){
      render();
      if(artifactApi){
        var html = fillTemplate(BODY_TEMPLATE, state);
        artifactApi.publish(html).catch(function(err){
          if(!err) return;
          if(err.code === 'conflict') return;
          if(err.code === 'not_writer' || err.code === 'not_granted'){
            readOnly = true;
            setSaveStatus('readonly');
            showToast('Aquesta vista és de només lectura.');
            return;
          }
          showToast('No s\'ha pogut desar el canvi. Torna-ho a provar.');
        });
        return;
      }
      if(artifactReady){
        showToast('Aquesta vista no pot desar canvis.');
        return;
      }
      try{
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
        setSaveStatus('local');
      }catch(e){
        setSaveStatus('preview');
        showToast('Aquest navegador no permet desar les dades.');
      }
    }

    function setViewMode(mode){
      state.settings.viewMode = mode;
      document.getElementById('view-cards').classList.toggle('active', mode === 'cards');
      document.getElementById('view-list').classList.toggle('active', mode === 'list');
      save();
    }

    document.addEventListener('DOMContentLoaded', function(){
      state = loadInitialState();
      if(!state.groups) state.groups = [];
      if(!state.history) state.history = [];
      if(!state.settings) state.settings = {};
      if(!state.settings.viewMode) state.settings.viewMode = 'cards';
      document.getElementById('view-cards').classList.toggle('active', state.settings.viewMode === 'cards');
      document.getElementById('view-list').classList.toggle('active', state.settings.viewMode === 'list');
      document.getElementById('view-cards').addEventListener('click', function(){ setViewMode('cards'); });
      document.getElementById('view-list').addEventListener('click', function(){ setViewMode('list'); });

      document.getElementById('tab-pending').addEventListener('click', function(){ showView('pending'); });
      document.getElementById('tab-history').addEventListener('click', function(){ showView('history'); });
      document.getElementById('detail-overlay').addEventListener('click', function(ev){ if(ev.target.id === 'detail-overlay') closeDetail(); });
      document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && !document.getElementById('detail-overlay').hidden) closeDetail(); });
      document.getElementById('history-status-filter').addEventListener('change', function(ev){ historyFilter.status = ev.target.value; renderHistory(); });
      document.getElementById('history-group-filter').addEventListener('change', function(ev){ historyFilter.groupId = ev.target.value; renderHistory(); });
      document.getElementById('undo-btn').addEventListener('click', function(){
        if(state.lastResolvedId) restoreFromHistory(state.lastResolvedId);
      });

      render();
      initPersistence();
    });
  </script>
</body>
</html>
